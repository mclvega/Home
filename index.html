  <!doctype html>
  <html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/m_sharp/512/FFFFFF/home.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">

    <style>
    .icon-img {
      width: 100px;
      height: 100px;
      object-fit: contain; /* mejor que cover para logos */
      padding: 10px;
      border-radius: 10px; 
      transition: transform 0.2s ease;
    }
    
    h1, h6 {
      font-family: 'Cinzel', serif;
    }

    .icon-img:hover {
      transform: scale(1.5);
    }

    a {
      text-decoration: none;
    }
    .container{
      padding-right: 0px;
    }
  </style>

  </head>
 <body class="bg-black text-white">
    <div id="hora" class="position-absolute top-0 end-0 m-3 fs-1"></div>

    <div class="container text-center mt-4 fs-1">
      <h1 class="display-1">McL</h1>
    </div>

    <div class="container mt-5">
      <div id="icon-grid" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-4 justify-content-center"></div>
    </div>

    <footer class="text-center mt-5 fs-5">
      <div id="footer"> <h6></h6></div>
      <a href="admin.html" class="text-secondary fs-6" title="Mantenedor de sitios">⚙ Mantenedor</a>
    </footer>


    <script>
      function mostrarHora() {
        const hora = new Date();
        const h = hora.getHours().toString().padStart(2, '0');
        const m = hora.getMinutes().toString().padStart(2, '0');
        document.getElementById("hora").innerText = `${h}:${m}`;
        setTimeout(mostrarHora, 1000);
      }

      // Lee los sitios desde el mantenedor (/api/sitios); si falla, usa sitios.json
      async function obtenerSitios() {
        for (const url of ['/api/sitios', 'sitios.json']) {
          try {
            const r = await fetch(url, { cache: 'no-store' });
            if (r.ok) return await r.json();
          } catch (e) {}
        }
        return [];
      }

      async function cargarIconos() {
        const icons = await obtenerSitios();
        const container = document.getElementById('icon-grid');
        icons.forEach(icon => {
          const col = document.createElement('div');
          col.className = 'col text-center';
          col.innerHTML = `
            <a target="_blank" rel="noopener noreferrer">
              <img class="icon-img rounded">
              <div class="text-white mt-2"></div>
            </a>`;
          const a = col.querySelector('a');
          a.href = icon.url;
          a.title = icon.name;
          col.querySelector('img').src = icon.img;
          col.querySelector('img').alt = icon.name;
          col.querySelector('div').textContent = icon.name;
          container.appendChild(col);
        });
      }

      mostrarHora();
      //document.getElementById("footer").innerText += " " + new Date().getFullYear();
      cargarIconos();
    </script>
  </body>
  </html>
