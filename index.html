<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Home</title>
  <link rel="icon" type="image/png" href="https://img.icons8.com/m_sharp/512/FFFFFF/home.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      background: #000;
      color: #fff;
      min-height: 100vh;
    }

    h1 {
      font-family: 'Cinzel', serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem 0;
    }

    #hora {
      font-size: 2rem;
      font-variant-numeric: tabular-nums;
      color: #888;
      min-width: 4ch;
      text-align: right;
    }

    .admin {
      color: #444;
      font-size: 1.5rem;
      min-width: 4ch;
      transition: color .2s;
    }

    .admin:hover, .admin:focus-visible {
      color: #fff;
    }

    /* Grilla de íconos: ocupa todo el ancho */
    #icon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 2rem 1rem;
    }

    .sitio {
      display: inline-block;
      border-radius: 14px;
      padding: .5rem;
      outline: none;
    }

    .sitio:focus-visible {
      box-shadow: 0 0 0 1px #fff;
    }

    .icon-img {
      width: 100px;
      height: 100px;
      object-fit: contain; /* mejor que cover para logos */
      padding: 10px;
      border-radius: 10px;
      transition: transform .2s ease;
    }

    .sitio:hover .icon-img, .sitio:focus-visible .icon-img {
      transform: scale(1.15);
    }

    .sitio:active .icon-img {
      transform: scale(.95);
    }

    /* Respaldo cuando el logo no carga: inicial del nombre */
    .inicial {
      width: 100px;
      height: 100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #222;
      border-radius: 50%;
      font-family: 'Cinzel', serif;
      font-size: 2.5rem;
      color: #888;
      transition: transform .2s ease;
    }

    .sitio:hover .inicial {
      transform: scale(1.15);
    }

    .nombre {
      color: #ccc;
      margin-top: .5rem;
      font-size: .95rem;
    }

    @media (max-width: 575px) {
      #icon-grid {
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      }

      .icon-img, .inicial {
        width: 72px;
        height: 72px;
      }

      .inicial {
        font-size: 1.8rem;
      }

      #hora {
        font-size: 1.4rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .icon-img, .inicial {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="admin.html" class="admin" title="Mantenedor de sitios" aria-label="Mantenedor de sitios">⚙</a>
    <h1 class="display-1 m-0">McL</h1>
    <div id="hora"></div>
  </header>

  <main class="px-3 px-md-5 my-5">
    <div id="icon-grid"></div>
  </main>

  <script>
    const CACHE = 'sitios-cache';

    // Reloj: se actualiza al cambiar el minuto
    function mostrarHora() {
      const hora = new Date();
      const h = hora.getHours().toString().padStart(2, '0');
      const m = hora.getMinutes().toString().padStart(2, '0');
      document.getElementById('hora').textContent = `${h}:${m}`;
      setTimeout(mostrarHora, 60000 - (Date.now() % 60000));
    }

    function crearIcono(icon) {
      const col = document.createElement('div');
      col.className = 'text-center';
      col.innerHTML = `
        <a class="sitio" target="_blank" rel="noopener noreferrer">
          <img class="icon-img" loading="lazy" decoding="async">
          <div class="nombre"></div>
        </a>`;
      const a = col.querySelector('a');
      const img = col.querySelector('img');
      a.href = icon.url;
      a.title = icon.name;
      img.alt = icon.name;
      col.querySelector('.nombre').textContent = icon.name;

      const usarInicial = () => {
        const ini = document.createElement('div');
        ini.className = 'inicial';
        ini.textContent = icon.name.charAt(0).toUpperCase();
        img.replaceWith(ini);
      };
      if (icon.img) {
        img.onerror = usarInicial;
        img.src = icon.img;
      } else {
        usarInicial();
      }
      return col;
    }

    function pintar(icons) {
      document.getElementById('icon-grid').replaceChildren(...icons.map(crearIcono));
    }

    // Pinta al instante con la última lista conocida y luego refresca desde el mantenedor
    async function cargarIconos() {
      let previa = null;
      try {
        previa = localStorage.getItem(CACHE);
        if (previa) pintar(JSON.parse(previa));
      } catch (e) {}

      try {
        const r = await fetch('/api/sitios', { cache: 'no-store' });
        if (!r.ok) return;
        const texto = await r.text();
        if (texto !== previa) pintar(JSON.parse(texto));
        try { localStorage.setItem(CACHE, texto); } catch (e) {}
      } catch (e) {}
    }

    mostrarHora();
    cargarIconos();
  </script>
</body>
</html>
