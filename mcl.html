<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Salto Vertical</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 10px;
    }

    #game-container {
      position: relative;
    }

    canvas {
      border: 3px solid #fff;
      border-radius: 8px;
      background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    }

   .instructions {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>
</head>
<body>

  <h1>¡Juego de Salto!</h1>
  <div id="game-container">
    <canvas id="canvas" width="600" height="300"></canvas>
  </div>
  <p class="instructions">Presiona <strong>ESPACIO</strong> o **Haz Clic** para saltar.</p>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const GRAVEDAD = 0.6;
    let puntaje = 0;
    let mejorPuntaje = 0;
    let juegoTerminado = false;
    let fotogramas = 0;

    const jugador = {
      x: 50,
      y: 200,
      ancho: 30,
      alto: 40,
      velocidadY: 0,
      fuerzaSalto: -12,
      enSuelo: false,
      color: '#FF5722',

      dibujar() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.ancho, this.alto);
        ctx.fillStyle = '#FFF';
        ctx.fillRect(this.x + 20, this.y + 8, 6, 6);
      },

      actualizar() {
        this.velocidadY += GRAVEDAD;
        this.y += this.velocidadY;

        if (this.y + this.alto >= 250) {
          this.y = 250 - this.alto;
          this.velocidadY = 0;
          this.enSuelo = true;
        } else {
          this.enSuelo = false;
        }
      },

      saltar() {
        if (this.enSuelo &&!juegoTerminado) {
          this.velocidadY = this.fuerzaSalto;
        }
      }
    };

    const obstaculos = [];
    class Obstaculo {
      constructor() {
        this.x = canvas.width;
        this.ancho = 20 + Math.random() * 15;
        this.alto = 30 + Math.random() * 25;
        this.y = 250 - this.alto;
        this.velocidad = 5 + Math.floor(puntaje / 10);
        this.color = '#5D4037'; // <- Corregido
      }

      dibujar() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.ancho, this.alto);
      }

      actualizar() {
        this.x -= this.velocidad;
      }
    }

    function dibujarSuelo() {
      ctx.fillStyle = '#4CAF50';
      ctx.fillRect(0, 250, canvas.width, 50);
      ctx.fillStyle = '#388E3C';
      ctx.fillRect(0, 250, canvas.width, 5);
    }

    function verificarColisiones() {
      obstaculos.forEach(obs => {
        if (
          jugador.x < obs.x + obs.ancho &&
          jugador.x + jugador.ancho > obs.x &&
          jugador.y < obs.y + obs.alto &&
          jugador.y + jugador.alto > obs.y
        ) {
          juegoTerminado = true;
        }
      });
    }

    function reiniciarJuego() {
      jugador.y = 200;
      jugador.velocidadY = 0;
      obstaculos.length = 0;
      if (puntaje > mejorPuntaje) mejorPuntaje = puntaje;
      puntaje = 0;
      fotogramas = 0;
      juegoTerminado = false;
      buclePrincipal();
    }

    function dibujarUI() {
      ctx.fillStyle = '#333';
      ctx.font = '16px sans-serif';
      ctx.fillText(`Puntos: ${puntaje}`, 15, 30);
      ctx.fillText(`Record: ${mejorPuntaje}`, 15, 50); // <- Corregido

      if (juegoTerminado) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('¡JUEGO TERMINADO!', canvas.width / 2, canvas.height / 2 - 10);

        ctx.font = '16px sans-serif';
        ctx.fillText('Presiona Espacio o Clic para reiniciar', canvas.width / 2, canvas.height / 2 + 25);
        ctx.textAlign = 'left';
      }
    }

    function buclePrincipal() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      dibujarSuelo();
      jugador.actualizar();
      jugador.dibujar();

      fotogramas++;
      if (fotogramas % 90 === 0) {
        obstaculos.push(new Obstaculo());
      }

      for (let i = obstaculos.length - 1; i >= 0; i--) {
        obstaculos[i].actualizar();
        obstaculos[i].dibujar();

        if (obstaculos[i].x + obstaculos[i].ancho < 0) {
          obstaculos.splice(i, 1);
          puntaje++;
        }
      }

      verificarColisiones();
      dibujarUI();

      if (!juegoTerminado) {
        requestAnimationFrame(buclePrincipal);
      }
    }

    function accion() {
      if (juegoTerminado) {
        reiniciarJuego();
      } else {
        jugador.saltar();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        accion();
      }
    });

    canvas.addEventListener('click', accion);

    buclePrincipal();
  </script>
</body>
</html>
